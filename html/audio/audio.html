<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- * this will not be shown on screen -->
     <p>Nothing showing on screen</p>
    <audio src="song.mp3"></audio>

    <!-- * this will be shown on screen -->
     <p>File is coming </p>
    <audio src="song.mp3" controls></audio>

    <!-- * this will strart playing as soon as the website is loaded -->
     <p>Autoplay Enabled</p>
     <audio src="song.mp3" controls  autoplay ></audio>
     
     <!-- * this will strart playing as soon as the website is loaded and will play continously-->
     <p>Autoplay+ loop Enabled</p>
     <audio src="song.mp3" controls  autoplay loop></audio>
     
     <!-- * this will strart playing as soon as the website is loaded and will play continously but default it will stay muted-->
     <p>Autoplay+ loop  + muted Enabled</p>
     <audio src="song.mp3" controls autoplay loop muted></audio>

     <p>another way of writing the audio tag</p>
    <audio controls>
        <source src="song.mp3" type="audio/mpeg">
    </audio>
</body>

</html>
