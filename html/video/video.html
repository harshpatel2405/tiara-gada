<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Only image (width and height</p>
    <video src="video.mp4" width="300" height="100"></video>

    <p>video can be played </p>
    <video src="video.mp4" controls width="300"></video>

    <p>autoplay enabled </p>
    <video src="video.mp4" controls width="300" autoplay></video>

    <p>autoplay + loop enabled </p>
    <video src="video.mp4" controls width="300" autoplay loop></video>

    <p>autoplay + loop+muted enabled </p>
    <video src="video.mp4" controls width="300" autoplay loop muted></video>
    
    <p>poster(thumbnail)</p>
    <video src="video.mp4" controls width="300"  poster="https://media.gettyimages.com/id/1262509230/video/shot-of-a-huge-male-grizzly-bear-walking-through-the-fresh-snow.jpg?s=640x640&k=20&c=hqO7UMDp311h_usaNMQXF4NOZKllzmPnwN2Zc0-iViM="></video>
</body>
</html>
