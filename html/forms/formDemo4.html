<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Form Demo 4</h1>



    <form>
        <table border="1" width="500px" height="120px">
            <tr>
                <td>
                    <label for="uname">Enter Your Name</label>
                </td>
                <td>
                    <input type="text" placeholder="Enter Name" id="uname">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="age">Enter Your age</label>
                </td>
                <td>
                    <input type="number" placeholder="Enter Age" id="age">
                </td>
            </tr>
            <tr>
                <td>
                    <label>Select Your Gender</label>
                </td>
                <td>
                    <input type="radio" name="gender">male
                    <input type="radio" name="gender">female
                </td>
            </tr>
            <tr>
                <td>
                    <label>Select Your Hobbies</label>
                </td>
                <td>
                    <input type="checkbox" name='hobby' value="cricket">Cricket<br>
                    <input type="checkbox" name='hobby' value="football">football<br>
                    <input type="checkbox" name='hobby' value="baseball">baseball<br>
                    <input type="checkbox" name='hobby' value="volleyball">volleyball<br>
                </td>
            </tr>

            <tr align="center">
                <td colspan="2">
                    <input type="submit">
                </td>
            </tr>
        </table>
    </form>
</body>

</html>
