<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center><b>Ordered List</b></center>

    <!-- *default type is 1 -->
      <ol>
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
    </ol>

    <ol type="i">
        <li>Lion</li>
        <li>Tiger</li>
        <li>Bear</li>
    </ol>

    <ol type="I">
        <li>Laptop</li>
        <li value=5>Mobile</li>
        <li>Smart Watch</li>
    </ol>
    <ol type="a" reversed>
        <li>ClassMate</li>
        <li>Nataraj</li>
        <li>Doms</li>
    </ol>

    <ol type="A" start="6">
        <li>Image</li>
        <li>Audio</li>
        <li>Video</li>
    </ol>

</body>
</html>
