<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center><h3>Unordered List</h3></center>

    <!-- * default type is disc -->
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
        <li value="Fruit">PineApple</li>
    </ul>

    <ul type="circle">
        <li>Lion</li>
        <li>Tiger</li>
        <li>Bear</li>
        <li>Fox</li>
    </ul>

    <ul type="square">
        <li>Laptop</li>
        <li>Mobile</li>
        <li>Smart Watch</li>
        <li>Headphones</li>
    </ul>
</body>
</html>
